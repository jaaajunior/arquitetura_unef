<title>Laboratório de Monge - UNEF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Prancheta de desenho. Cor tem função: laranja-tijolo = PH (horizontal), azul = PV (vertical), verde-petróleo = o objeto no espaço. */
:root{
  --paper:#ECEFED; --sheet:#F8FAF8; --ink:#14202A; --ink-2:#4B5966; --rule:#C5CEC9; --chip:#E1E7E4;
  --grid:rgba(20,32,42,.075); --grid-2:rgba(20,32,42,.16);
  --ph:#BF4519; --pv:#1F55B3; --obj:#08766A; --ok:#1B7A43; --bad:#B3261E;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D141B; --sheet:#121C25; --ink:#E6ECF1; --ink-2:#9AA8B5; --rule:#2A3945; --chip:#1B2833;
    --grid:rgba(230,236,241,.07); --grid-2:rgba(230,236,241,.16);
    --ph:#F28D63; --pv:#78A6F8; --obj:#42C9B4; --ok:#5CC98A; --bad:#F2877F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D141B; --sheet:#121C25; --ink:#E6ECF1; --ink-2:#9AA8B5; --rule:#2A3945; --chip:#1B2833;
  --grid:rgba(230,236,241,.07); --grid-2:rgba(230,236,241,.16);
  --ph:#F28D63; --pv:#78A6F8; --obj:#42C9B4; --ok:#5CC98A; --bad:#F2877F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font:400 15px/1.55 var(--f-body);
  padding-block:14px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;display:grid;gap:16px}

/* cabeçalho em forma de legenda de prancha */
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{margin:0 0 2px;font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{margin:0;font:700 clamp(28px,5vw,40px)/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.tabs{display:flex;border:1.5px solid var(--ink);background:var(--sheet)}
.tabs button{appearance:none;background:transparent;border:0;border-right:1.5px solid var(--ink);padding:9px 18px;font:600 14px var(--f-display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.vb:focus-visible,input:focus-visible,canvas:focus-visible,summary:focus-visible{outline:2px solid var(--obj);outline-offset:2px}

/* palco */
.stage{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.views{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);min-width:0}
.side{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);min-width:0;align-content:start}
@media (min-width:700px){
  .views{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
}
@media (min-width:1100px){
  .stage{grid-template-columns:minmax(320px,370px) minmax(0,1fr);align-items:start}
  .side{order:-1;grid-template-columns:minmax(0,1fr)}
}
.view{margin:0;background:var(--sheet);border:1.5px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.view figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-bottom:1.5px solid var(--ink);font:600 13px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.view figcaption i{font:400 11px var(--f-mono);letter-spacing:.04em;text-transform:none;color:var(--ink-2);font-style:normal;margin-left:6px}
.vbtns{display:flex;gap:4px;flex-wrap:wrap}
.vb{appearance:none;background:transparent;border:1px solid var(--rule);padding:2px 8px;font:500 11px var(--f-mono);cursor:pointer;color:var(--ink-2)}
.vb:hover{border-color:var(--ink);color:var(--ink)}
canvas{display:block;width:100%;aspect-ratio:4/3;max-width:100%}
@media (min-width:700px){canvas{aspect-ratio:1/1}}
#cv3{cursor:grab;touch-action:none;aspect-ratio:1/1}
.under{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;justify-content:space-between;margin:0;font-size:13px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block;border-radius:50%}
.sw.ph{background:var(--ph)}.sw.pv{background:var(--pv)}.sw.obj{background:var(--obj)}

/* painéis laterais */
.card{background:var(--sheet);border:1.5px solid var(--ink);padding:14px 16px 16px;min-width:0}
.sec{margin:0 0 10px;font:600 11.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sec:not(:first-child){margin-top:18px}
.sl{display:grid;grid-template-columns:minmax(86px,auto) minmax(0,1fr) 46px;gap:8px;align-items:center;margin:0 0 2px;font-size:13px}
.sl .sl-l{font-family:var(--f-mono);font-size:12px}
.sl output{font:500 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;height:30px;accent-color:var(--ink)}
.k-ph input{accent-color:var(--ph)}.k-pv input{accent-color:var(--pv)}.k-obj input{accent-color:var(--obj)}
.k-ph .sl-l{color:var(--ph)}.k-pv .sl-l{color:var(--pv)}.k-obj .sl-l{color:var(--obj)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;background:transparent;border:1.5px solid var(--ink);padding:4px 10px;font:500 12.5px var(--f-body);cursor:pointer}
.chip:hover{background:var(--chip)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{appearance:none;background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink);padding:7px 14px;font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.ghost:hover:not(:disabled){background:var(--chip);filter:none}
.btn:disabled{opacity:.4;cursor:default}
.subpair{display:grid;gap:0}

/* leitura */
.big{margin:0 0 6px;font:600 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;margin:0 0 10px;padding:2px 10px;border:1.5px solid var(--obj);color:var(--obj);font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 10px;font-size:13.5px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.kv dd.m,.mono{font-family:var(--f-mono);font-size:13px}
#info p{margin:0 0 8px;font-size:14px;max-width:62ch}
#info p.note{color:var(--ink-2);font-size:13.5px}
.primer{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px;font-size:13.5px}
.primer summary{cursor:pointer;font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.primer ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px}
.warn{color:var(--bad)}

/* prática */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.score{color:var(--obj)}
.qtext{margin:0 0 10px;font-size:15px;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.opt{appearance:none;background:transparent;border:1.5px solid var(--ink);padding:8px 10px;text-align:left;font:500 13.5px/1.3 var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:disabled{cursor:default}
.opt[data-state="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt[data-state="bad"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.steps{margin:0 0 8px;padding-left:20px;display:grid;gap:4px;font-size:14px}
.steps li{color:var(--ink-2)}.steps li.now{color:var(--ink);font-weight:600}.steps li.done{color:var(--ok)}
.verdict{margin:0 0 8px;font:700 18px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
@media (max-width:560px){
  .tabs{width:100%}.tabs button{flex:1;padding-inline:6px}
  .card{padding:12px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div>
      <p class="kicker">Geometria Descritiva · Método de Monge</p>
      <h1>Laboratório de Monge</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Módulos">
      <button role="tab" data-mod="ponto" aria-selected="true">Ponto</button>
      <button role="tab" data-mod="reta" aria-selected="false">Reta</button>
      <button role="tab" data-mod="plano" aria-selected="false">Plano</button>
      <button role="tab" data-mod="prat" aria-selected="false">Praticar</button>
    </nav>
  </header>

  <div class="stage">
    <div class="views">
      <figure class="view">
        <figcaption>
          <span>Espaço<i>perspectiva</i></span>
          <span class="vbtns" aria-label="Pontos de vista">
            <button class="vb" data-act="view" data-v="persp">perspectiva</button>
            <button class="vb" data-act="view" data-v="front">frente</button>
            <button class="vb" data-act="view" data-v="top">cima</button>
            <button class="vb" data-act="view" data-v="side">lado</button>
          </span>
        </figcaption>
        <canvas id="cv3" tabindex="0" role="img" aria-label="Perspectiva dos planos de projeção"></canvas>
      </figure>
      <figure class="view">
        <figcaption><span>Épura<i>PH rebatido sobre o PV</i></span></figcaption>
        <canvas id="cvE" role="img" aria-label="Épura"></canvas>
      </figure>
      <p class="under">
        <span class="legend" aria-label="Legenda de cores">
          <span><i class="sw ph"></i>PH · A′, αh</span>
          <span><i class="sw pv"></i>PV · A″, αv</span>
          <span><i class="sw obj"></i>no espaço</span>
        </span>
        <span id="hint"></span>
      </p>
    </div>

    <div class="side">
      <section class="card" id="ctl" aria-label="Controles"></section>
      <section class="card" id="info" aria-live="polite" aria-label="Leitura"></section>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
let R=7; const DIST=34, EPS=1e-9;
/* quadro adaptável: 7 (padrão) ou 12 quando algum valor passa de 6 em módulo (limite dos controles: ±10) */
function updR(){ let m=0; const t=(...a)=>a.forEach(v=>{ if(isFinite(v)) m=Math.max(m,Math.abs(v)); });
  const p=st.ponto,A=st.reta.A,B=st.reta.B,q=st.plano; if(st.mod==="ponto") t(p.x,p.y,p.z); else if(st.mod==="reta") t(A.x,A.y,A.z,B.x,B.y,B.z);
  else if(st.mod==="plano"){ t(q.tipo==="obl"?q.x0:0); if(q.tipo==="par") t(q.y0,q.z0); if(["hor","fro","per"].includes(q.tipo)) t(q.k); }
  if(st.mod==="prat"&&pr&&pr.q&&pr.q.obj){ const o=pr.q.obj; if(o.p) t(o.p.x,o.p.y,o.p.z); if(o.A) t(o.A.x,o.A.y,o.A.z); if(o.B) t(o.B.x,o.B.y,o.B.z); }
  R=m>6?12:7; }
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const zero=v=>Math.abs(v)<EPS?0:v;
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const fv=v=>{v=zero(Math.round(v*100)/100);return (v<0?'−':'')+String(Math.abs(v)).replace('.',',');};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const snap=(v,s)=>Math.round(v/s)*s;

/* ================= estado ================= */
const st={
  mod:'ponto', theta:0,
  ponto:{x:2,y:3,z:4},
  reta:{A:{x:-3,y:1,z:5},B:{x:3,y:5,z:1}},
  plano:{tipo:'obl',x0:-1,ah:60,av:50,y0:4,z0:3,k:3,t:35}
};
const cam={yaw:.62,pitch:.42,ty:null,tp:null};
const pr={kind:'todos',q:null,answered:false,choice:null,ok:0,total:0,n:0,guesses:[]};
const getp=p=>p.split('.').reduce((o,k)=>o[k],st);
const setp=(p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((o,k)=>o[k],st)[l]=v;};

/* ================= geometria ================= */
function posPonto(p){
  const y=zero(p.y), z=zero(p.z);
  if(y===0&&z===0) return {id:'LT',dih:0,nome:'Pertence à LT',expl:'Cota e afastamento nulos: A, A′ e A″ coincidem sobre a LT.'};
  if(z===0) return y>0
    ? {id:'PH',dih:0,nome:'Pertence ao PH anterior',expl:'Cota nula: A pertence ao PH, logo A ≡ A′ e A″ fica sobre a LT. Está na fronteira entre o 1º e o 4º diedros.'}
    : {id:'PH',dih:0,nome:'Pertence ao PH posterior',expl:'Cota nula: A pertence ao PH, logo A ≡ A′ e A″ fica sobre a LT. Está na fronteira entre o 2º e o 3º diedros.'};
  if(y===0) return z>0
    ? {id:'PV',dih:0,nome:'Pertence ao PV superior',expl:'Afastamento nulo: A pertence ao PV, logo A ≡ A″ e A′ fica sobre a LT. Está na fronteira entre o 1º e o 2º diedros.'}
    : {id:'PV',dih:0,nome:'Pertence ao PV inferior',expl:'Afastamento nulo: A pertence ao PV, logo A ≡ A″ e A′ fica sobre a LT. Está na fronteira entre o 3º e o 4º diedros.'};
  if(y>0&&z>0) return {id:'1',dih:1,nome:'1º diedro',expl:'Cota positiva (acima do PH) e afastamento positivo (à frente do PV): A′ fica abaixo da LT e A″ acima dela.'};
  if(y<0&&z>0) return {id:'2',dih:2,nome:'2º diedro',expl:'Cota positiva (acima do PH) e afastamento negativo (atrás do PV): A′ e A″ ficam ambos acima da LT.'};
  if(y<0&&z<0) return {id:'3',dih:3,nome:'3º diedro',expl:'Cota negativa (abaixo do PH) e afastamento negativo (atrás do PV): A′ fica acima da LT e A″ abaixo dela.'};
  return {id:'4',dih:4,nome:'4º diedro',expl:'Cota negativa (abaixo do PH) e afastamento positivo (à frente do PV): A′ e A″ ficam ambos abaixo da LT.'};
}
function bisPonto(p){
  const y=zero(p.y), z=zero(p.z);
  if(y===0||z===0) return '';
  if(y===z) return 'Afastamento igual à cota: A pertence ao plano bissetor dos diedros ímpares (β₁). As projeções ficam simétricas em relação à LT.';
  if(y===-z) return 'Afastamento oposto à cota: A pertence ao plano bissetor dos diedros pares (β₂). As projeções A′ e A″ coincidem na épura.';
  return '';
}
function classReta(d){
  const X=d[0]!==0,Y=d[1]!==0,Z=d[2]!==0;
  if(!X&&!Y&&!Z) return 'ponto';
  if(X&&!Y&&!Z) return 'fronto';
  if(!X&&!Y&&Z) return 'vertical';
  if(!X&&Y&&!Z) return 'topo';
  if(!X&&Y&&Z) return 'perfil';
  if(X&&Y&&!Z) return 'horizontal';
  if(X&&!Y&&Z) return 'frontal';
  return 'qualquer';
}
function analisaReta(A,B){
  const d=[zero(B.x-A.x),zero(B.y-A.y),zero(B.z-A.z)];
  const id=classReta(d), L=Math.hypot(d[0],d[1],d[2]);
  const o={id,d,L,H:null,V:null,angH:0,angV:0};
  if(L>0){ o.angH=deg(Math.asin(clamp(Math.abs(d[2])/L,0,1))); o.angV=deg(Math.asin(clamp(Math.abs(d[1])/L,0,1))); }
  if(d[2]!==0){const t=-A.z/d[2]; o.H={t,x:A.x+t*d[0],y:A.y+t*d[1]};}
  if(d[1]!==0){const t=-A.y/d[1]; o.V={t,x:A.x+t*d[0],z:A.z+t*d[2]};}
  o.noPH=d[2]===0&&zero(A.z)===0; o.noPV=d[1]===0&&zero(A.y)===0;
  return o;
}
function lineRange(A,d){
  if(d[0]===0&&d[1]===0&&d[2]===0) return [0,0];
  let t0=-1e9,t1=1e9; const a=[A.x,A.y,A.z];
  for(let i=0;i<3;i++){
    if(Math.abs(d[i])<EPS){ if(Math.abs(a[i])>R) return null; }
    else{ let u=(-R-a[i])/d[i], v=(R-a[i])/d[i]; if(u>v){const s=u;u=v;v=s;} t0=Math.max(t0,u); t1=Math.min(t1,v); }
  }
  return t0<=t1?[t0,t1]:null;
}
function planeFromParams(pl){
  let n,d,x0=null;
  if(pl.tipo==='obl'){
    const ah=rad(pl.ah), av=rad(pl.av);
    n=[-Math.sin(ah)*Math.sin(av),-Math.cos(ah)*Math.sin(av),Math.sin(ah)*Math.cos(av)]; x0=pl.x0; d=null;
  }else if(pl.tipo==='par'){
    const y0=Math.abs(pl.y0)<.5?(pl.y0<0?-.5:.5):pl.y0, z0=Math.abs(pl.z0)<.5?(pl.z0<0?-.5:.5):pl.z0;
    n=[0,1/y0,1/z0]; d=1;
  }else if(pl.tipo==='hor'){ n=[0,0,1]; d=pl.k; }
  else if(pl.tipo==='fro'){ n=[0,1,0]; d=pl.k; }
  else if(pl.tipo==='per'){ n=[1,0,0]; d=pl.k; }
  else { const a=rad(pl.t); n=[0,-Math.sin(a),Math.cos(a)]; d=0; }
  n=n.map(zero);
  if(d===null) d=n[0]*x0;
  const m=Math.hypot(n[0],n[1],n[2]);
  n=n.map(v=>zero(v/m)); d=zero(d/m);
  return {n,d,x0,tipo:pl.tipo};
}
const PLANO_INFO={
  horizontal:{nome:'Plano horizontal',def:'Paralelo ao PH e perpendicular ao PV: todos os pontos têm a mesma cota.',tr:'Não tem traço horizontal. O traço vertical αv é paralelo à LT.'},
  frontal:{nome:'Plano frontal',def:'Paralelo ao PV e perpendicular ao PH: todos os pontos têm o mesmo afastamento.',tr:'Não tem traço vertical. O traço horizontal αh é paralelo à LT.'},
  perfil:{nome:'Plano de perfil',def:'Perpendicular à LT, portanto ao PH e ao PV: todos os pontos têm a mesma abscissa.',tr:'αh e αv são perpendiculares à LT e ficam no mesmo alinhamento.'},
  vertical:{nome:'Plano vertical',def:'Perpendicular ao PH e oblíquo ao PV. É projetante horizontal.',tr:'αv é perpendicular à LT e αh é oblíquo. Tudo o que está no plano se projeta horizontalmente sobre αh.'},
  topo:{nome:'Plano de topo',def:'Perpendicular ao PV e oblíquo ao PH. É projetante vertical.',tr:'αh é perpendicular à LT e αv é oblíquo. Tudo o que está no plano se projeta verticalmente sobre αv.'},
  paralelo:{nome:'Plano paralelo à LT',def:'Oblíquo ao PH e ao PV, mas paralelo à LT.',tr:'αh e αv são ambos paralelos à LT.'},
  contem:{nome:'Plano que contém a LT',def:'Oblíquo ao PH e ao PV e passa pela LT.',tr:'αh e αv coincidem com a LT. Para representá-lo é preciso um terceiro plano de projeção (de perfil).'},
  qualquer:{nome:'Plano oblíquo',def:'Oblíquo ao PH e ao PV e não paralelo à LT.',tr:'αh e αv são oblíquos à LT e concorrem num ponto da LT.'}
};
function classPlane(def){
  const [a,b,c]=def.n, d=zero(def.d);
  const A=a!==0,B=b!==0,C2=c!==0;
  let id;
  if(!A&&!B&&C2) id='horizontal';
  else if(!A&&B&&!C2) id='frontal';
  else if(A&&!B&&!C2) id='perfil';
  else if(!A&&B&&C2) id=d===0?'contem':'paralelo';
  else if(A&&B&&!C2) id='vertical';
  else if(A&&!B&&C2) id='topo';
  else id='qualquer';
  const o={id,...PLANO_INFO[id]};
  o.angH=deg(Math.acos(clamp(Math.abs(c),0,1)));

function planePoly(n,d){
  const pts=[]; const add=p=>{ if(!pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1],q[2]-p[2])<1e-6)) pts.push(p); };

function traceE(a,b,c,solidSign,col,label){
  const g=ctxE, seg=clipLine(a,b,c,WE/2/scE,HE/2/scE); if(!seg) return;
  const [p,q]=seg; const parts=[];
  if(p.v*q.v<-1e-9){ const t=p.v/(p.v-q.v); const m={u:p.u+t*(q.u-p.u),v:0}; parts.push([p,m],[m,q]); } else parts.push([p,q]);
  const items=parts.map(([s,e])=>{ const m=(s.v+e.v)/2; return {s,e,solid:Math.abs(m)<1e-9||Math.sign(m)===solidSign}; });
  const pt=u=>EP(u.u,u.v);
  items.filter(i=>!i.solid).forEach(i=>ln(g,pt(i.s),pt(i.e),col,1.7,[7,5],.9));
  items.filter(i=>i.solid).forEach(i=>ln(g,pt(i.s),pt(i.e),col,3.4));
  const sol=items.find(i=>i.solid)||items[0];
  const ends=[sol.s,sol.e].sort((u,v)=>Math.abs(v.v)-Math.abs(u.v));
  let L=pt(ends[0]); const O=pt(ends[1]); const len=Math.hypot(L.x-O.x,L.y-O.y)||1;
  const f=Math.min(34,len*.4)/len; L={x:L.x+(O.x-L.x)*f,y:L.y+(O.y-L.y)*f};
  txt(g,label,clamp(L.x+8,10,WE-30),clamp(L.y+(solidSign<0?-8:16),14,HE-8),col,{size:13,bold:true});
}

  const [nx,ny,nz]=def.n,d=def.d;

function loop(){ if(running)return; running=true; requestAnimationFrame(frame); }
function frame(now){
  running=false; let more=false;
  if(anim){
    const p=clamp((now-anim.t0)/anim.dur,0,1), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    st.theta=anim.from+(anim.to-anim.from)*e; more=true; dirty=true; syncOut();
    if(p>=1){ anim=null; syncOut(); }
  }
  if(cam.ty!==null){
    let dy=cam.ty-cam.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); const dp=cam.tp-cam.pitch;
    cam.yaw+=dy*.2; cam.pitch+=dp*.2; dirty=true; more=true;
    if(Math.abs(dy)<.004&&Math.abs(dp)<.004){ cam.yaw=cam.ty; cam.pitch=cam.tp; cam.ty=null; }
  }
  if(dirty){ dirty=false; readColors(); draw3(); drawE(); }
  if(more) loop();

  return `<h2 class="sec">Leitura</h2><span class="tag">${ci.nome}</span><p>${ci.def}</p><p>${ci.tr}</p>${ci.nota?`<p class="note">${ci.nota}</p>`:''}
  <dl class="kv"><dt>Com o PH</dt><dd class="m">${fv(ci.angH)}°</dd><dt>Com o PV</dt><dd class="m">${fv(ci.angV)}°</dd></dl>
  ${primer(['Um plano α é representado pelos seus traços: αh (interseção com o PH) e αv (interseção com o PV). Se não são paralelos à LT, os dois traços concorrem num ponto da LT.','Na épura, o αh aparece contínuo abaixo da LT e o αv contínuo acima dela, a parte que fica no 1º diedro. O restante é tracejado.','Planos projetantes são perpendiculares a um plano de projeção: o plano vertical (projetante horizontal) e o plano de topo (projetante vertical).','Os planos bissetores β₁ (diedros ímpares) e β₂ (diedros pares) contêm a LT e dividem ao meio os ângulos entre PH e PV.'])}`;
}
function infoPrat(){
  const q=pr.q;
  if(!pr.answered){
    const dicas={ponto:'Compare a posição de A′ e A″ em relação à LT: A″ acima da LT indica cota positiva; A′ abaixo da LT indica afastamento positivo.',
      reta:'Veja se r′ e r″ são paralelas à LT, perpendiculares a ela ou se alguma se reduz a um ponto.',
      plano:'Observe como os traços αh e αv se posicionam em relação à LT: paralelos, perpendiculares, oblíquos ou ausentes.',
      marcar:'A″ fica na linha de chamada de A, a uma distância da LT igual à cota. A′ fica na mesma linha de chamada, a uma distância igual ao afastamento, do lado oposto quando os dois são positivos.'};
    return `<h2 class="sec">Dica</h2><p>${dicas[q.kind]}</p>${primer(['As questões são geradas ao acaso. Depois de responder, o espaço mostra a figura e você pode rebater o PH para conferir a épura.','Para marcar projeções, o clique é ajustado ao ponto inteiro mais próximo da grade.'])}`;
  }
  return `<h2 class="sec">Correção</h2><p class="verdict ${pr.lastOk?'ok':'bad'}">${pr.lastOk?'Correto':'Ainda não'}</p>${q.explain()}`;
}
function renderInfo(){
  const f=st.mod==='ponto'?infoPonto:st.mod==='reta'?infoReta:st.mod==='plano'?infoPlano:infoPrat;
  const el=$('#info'); const open=$('.primer',el)&&$('.primer',el).open; el.innerHTML=f(); const nu=$('.primer',el); if(nu&&open) nu.open=true;
}
function updateAria(){
  let s;
  if(st.mod==='ponto') s=`Ponto A(${fv(st.ponto.x)}; ${fv(st.ponto.y)}; ${fv(st.ponto.z)}), ${posPonto(st.ponto).nome}`;
  else if(st.mod==='reta') s=`Reta AB: ${RETA_INFO[analisaReta(st.reta.A,st.reta.B).id].nome}`;
  else if(st.mod==='plano') s=`Plano: ${classPlane(planeFromParams(st.plano)).nome}`;
  else s='Exercício de prática';
  cv3.setAttribute('aria-label','Perspectiva. '+s); cvE.setAttribute('aria-label','Épura. '+s);
  const hints={ponto:'Arraste A′ e A″ na épura ou gire o espaço com o dedo ou o mouse.',reta:'Arraste os pontos na épura ou gire o espaço com o dedo ou o mouse.',plano:'Gire o espaço com o dedo ou o mouse. Duplo toque restaura a vista.',prat:'Gire o espaço com o dedo ou o mouse.'};
  $('#hint').textContent=hints[st.mod];
}
function render(){ renderCtl(); renderInfo(); updateAria(); requestDraw(); }
function changed(){ renderInfo(); updateAria(); syncOut(); requestDraw(); }

/* ================= prática ================= */
const nz=(a,b)=>{let v;do{v=ri(a,b);}while(v===0);return v;};
const sgn=()=>pick([-1,1]);
const farFrom=v=>{let u;do{u=ri(-5,5);}while(Math.abs(u-v)<2);return u;};
const OPT_PONTO=[['1','1º diedro'],['2','2º diedro'],['3','3º diedro'],['4','4º diedro'],['PH','No PH'],['PV','No PV']];
const OPT_RETA=[['horizontal','Horizontal'],['frontal','Frontal'],['fronto','Fronto-horizontal'],['vertical','Vertical'],['topo','De topo'],['perfil','De perfil'],['qualquer','Qualquer']];
const OPT_PLANO=[['horizontal','Horizontal'],['frontal','Frontal'],['perfil','De perfil'],['vertical','Vertical'],['topo','De topo'],['paralelo','Paralelo à LT'],['qualquer','Oblíquo']];
const gen={
  ponto(){
    const id=pick(['1','2','3','4','1','2','3','4','PH','PV']); let y,z; const a=()=>nz(1,5);
    if(id==='1'){y=a();z=a();} else if(id==='2'){y=-a();z=a();} else if(id==='3'){y=-a();z=-a();} else if(id==='4'){y=a();z=-a();}
    else if(id==='PH'){y=nz(-5,5);z=0;} else {y=0;z=nz(-5,5);}
    const p={x:ri(-4,4),y,z}; const ps=posPonto(p);
    return {kind:'ponto',obj:{kind:'ponto',p},answer:id,opts:OPT_PONTO,text:'Observe a épura do ponto A. Onde ele está?',
      explain:()=>`<p>A(${fv(p.x)}; ${fv(p.y)}; ${fv(p.z)}): ${ps.nome}.</p><p>${ps.expl}</p>`};
  },
  reta(){
    const cls=pick(['horizontal','frontal','fronto','vertical','topo','perfil','qualquer','qualquer']);
    const x1=ri(-5,5),y1=ri(-5,5),z1=ri(-5,5); let B;
    switch(cls){
      case 'horizontal':B={x:farFrom(x1),y:farFrom(y1),z:z1};break;
      case 'frontal':B={x:farFrom(x1),y:y1,z:farFrom(z1)};break;
      case 'fronto':B={x:farFrom(x1),y:y1,z:z1};break;
      case 'vertical':B={x:x1,y:y1,z:farFrom(z1)};break;
      case 'topo':B={x:x1,y:farFrom(y1),z:z1};break;
      case 'perfil':B={x:x1,y:farFrom(y1),z:farFrom(z1)};break;
      default:B={x:farFrom(x1),y:farFrom(y1),z:farFrom(z1)};
    }
    const A={x:x1,y:y1,z:z1}; const ar=analisaReta(A,B), info=RETA_INFO[ar.id];
    return {kind:'reta',obj:{kind:'reta',A,B},answer:ar.id,opts:OPT_RETA,text:'Observe as projeções r′ e r″ da reta AB. Como ela é classificada?',
      explain:()=>`<p><b>${info.nome}.</b> ${info.def}</p><p>Na épura: ${info.ep}</p>`};
  },
  plano(){
    const cls=pick(['horizontal','frontal','perfil','vertical','topo','paralelo','qualquer']);
    const angs=[30,40,50,60,120,130,140,150], x0=ri(-3,3), s=()=>sgn()*ri(2,5);
    let pl;
    switch(cls){
      case 'horizontal':pl={tipo:'hor',k:s()};break;
      case 'frontal':pl={tipo:'fro',k:s()};break;
      case 'perfil':pl={tipo:'per',k:ri(-4,4)};break;
      case 'vertical':pl={tipo:'obl',x0,ah:pick(angs),av:90};break;
      case 'topo':pl={tipo:'obl',x0,ah:90,av:pick(angs)};break;
      case 'paralelo':pl={tipo:'par',y0:s(),z0:s()};break;
      default:pl={tipo:'obl',x0,ah:pick(angs),av:pick(angs)};
    }
    const def=planeFromParams(pl), ci=classPlane(def);
    return {kind:'plano',obj:{kind:'plano',def},answer:ci.id,opts:OPT_PLANO,text:'Observe os traços do plano α. Como ele é classificado?',
      explain:()=>`<p><b>${ci.nome}.</b> ${ci.def}</p><p>${ci.tr}</p>`};
  },
  marcar(){
    const p={x:ri(-5,5),y:nz(-5,5),z:nz(-5,5)}, ps=posPonto(p);
    return {kind:'marcar',obj:{kind:'ponto',p},text:`Marque na épura as projeções do ponto A(${fv(p.x)}; ${fv(p.y)}; ${fv(p.z)}).`,
      explain:()=>`<p>A′ fica em ${fv(Math.abs(p.y))} ${p.y>0?'abaixo':'acima'} da LT (afastamento ${fv(p.y)}) e A″ em ${fv(Math.abs(p.z))} ${p.z>0?'acima':'abaixo'} da LT (cota ${fv(p.z)}), na mesma linha de chamada, sobre a abscissa ${fv(p.x)}.</p><p>${ps.nome}.</p>`};
  }
};
function newQ(){
  const k=pr.kind==='todos'?pick(['ponto','reta','plano','marcar']):pr.kind;
  pr.q=gen[k](); pr.answered=false; pr.choice=null; pr.guesses=[]; pr.n++; st.theta=0; anim=null; render();
}
function answer(ok,choice){
  pr.answered=true; pr.choice=choice; pr.lastOk=ok; pr.total++; if(ok) pr.ok++;
  render(); animTheta(90);
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, v=b.dataset.v;
  if(act==='view'){ const t=VIEWS[v]; cam.ty=t[0]; cam.tp=t[1]; requestDraw(); }
  else if(act==='reb'){ animTheta(st.theta>=89.5||(anim&&anim.to===90)?0:90); }
  else if(act==='pre'){
    if(st.mod==='ponto'){ const a=PRE_PONTO.find(r=>r[0]===v)[2]; st.ponto={x:a[0],y:a[1],z:a[2]}; }
    else { const a=PRE_RETA.find(r=>r[0]===v)[2]; st.reta={A:{x:a[0],y:a[1],z:a[2]},B:{x:a[3],y:a[4],z:a[5]}}; }
    changed();
  }
  else if(act==='ptipo'){ st.plano.tipo=v; render(); }
  else if(act==='pobl'){ const [a,c]=v.split(',').map(Number); st.plano.ah=a; st.plano.av=c; changed(); }
  else if(act==='plt'){ st.plano.t=Number(v); changed(); }
  else if(act==='qkind'){ pr.kind=v; newQ(); }
  else if(act==='opt'){ answer(v===pr.q.answer,v); }
  else if(act==='next'){ newQ(); }
  else if(act==='redo'){ pr.guesses=[]; render(); }
});
$('#ctl').addEventListener('input',e=>{
  const el=e.target; if(!el.dataset||!el.dataset.k) return;
  const v=parseFloat(el.value);
  if(el.dataset.k==='theta'){ anim=null; st.theta=v; syncOut(); requestDraw(); return; }
  setp(el.dataset.k,v);
  if(st.mod==='plano'&&(el.dataset.k==='plano.y0'||el.dataset.k==='plano.z0')&&Math.abs(v)<.5){ /* evita plano indefinido */ }
  changed();
});
$$('.tabs [role=tab]').forEach(b=>b.addEventListener('click',()=>{
  st.mod=b.dataset.mod; $$('.tabs [role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));
  anim=null; if(st.mod==='prat'){ if(!pr.q) newQ(); else { st.theta=pr.answered?st.theta:0; render(); } } else render();
}));

/* órbita 3D */
let drag3=null;
cv3.addEventListener('pointerdown',e=>{ cv3.setPointerCapture(e.pointerId); drag3={x:e.clientX,y:e.clientY}; cam.ty=null; cv3.style.cursor='grabbing'; });
cv3.addEventListener('pointermove',e=>{ if(!drag3) return; const dx=e.clientX-drag3.x,dy=e.clientY-drag3.y; drag3.x=e.clientX; drag3.y=e.clientY; cam.yaw+=dx*.009; cam.pitch=clamp(cam.pitch+dy*.009,-1.5,1.5); requestDraw(); });
const endDrag3=()=>{ drag3=null; cv3.style.cursor='grab'; };
cv3.addEventListener('pointerup',endDrag3); cv3.addEventListener('pointercancel',endDrag3);
cv3.addEventListener('dblclick',()=>{ cam.ty=VIEWS.persp[0]; cam.tp=VIEWS.persp[1]; requestDraw(); });
cv3.addEventListener('keydown',e=>{
  const k={ArrowLeft:[-.1,0],ArrowRight:[.1,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key]; if(!k) return;
  e.preventDefault(); cam.ty=null; cam.yaw+=k[0]; cam.pitch=clamp(cam.pitch+k[1],-1.5,1.5); requestDraw();
});

/* épura: arrastar projeções e marcar pontos */
let dragE=null;
function epPos(e){ const r=cvE.getBoundingClientRect(); return {px:e.clientX-r.left,py:e.clientY-r.top,x:(e.clientX-r.left-WE/2)/scE,e:(HE/2-(e.clientY-r.top))/scE}; }
function hit(pos){ let best=null,bd=20; handles.forEach(h=>{const d=Math.hypot(h.x-pos.px,h.y-pos.py); if(d<bd){bd=d;best=h;}}); return best; }
cvE.addEventListener('pointerdown',e=>{
  const pos=epPos(e);
  if(st.mod==='prat'&&pr.q&&pr.q.kind==='marcar'&&!pr.answered){
    if(pr.guesses.length>=2) return;
    pr.guesses.push({x:clamp(Math.round(pos.x),-7,7),e:clamp(Math.round(pos.e),-7,7)});
    if(pr.guesses.length===2){
      const p=pr.q.obj.p, g=pr.guesses; const ok=g[0].x===p.x&&g[0].e===-p.y&&g[1].x===p.x&&g[1].e===p.z;
      answer(ok,null);
    } else render();
    return;
  }
  const h=hit(pos); if(!h) return; dragE=h.id; cvE.setPointerCapture(e.pointerId); cvE.style.cursor='grabbing';
});
cvE.addEventListener('pointermove',e=>{
  const pos=epPos(e);
  if(!dragE){ cvE.style.cursor=(st.mod==='prat'&&pr.q&&pr.q.kind==='marcar'&&!pr.answered)?'crosshair':hit(pos)?'grab':'default'; return; }
  const x=clamp(snap(pos.x,.5),-10,10), ee=clamp(snap(pos.e,.5),-10,10);
  if(st.mod==='ponto'){
    if(dragE==='p2'){ st.ponto.x=x; st.ponto.z=ee; } else { st.ponto.x=x; st.ponto.y=-ee; }
  }else if(st.mod==='reta'){
    const P=dragE[0]==='A'?st.reta.A:st.reta.B; P.x=x; if(dragE[1]==='2') P.z=ee; else P.y=-ee;
  }
  st.ponto.y=zero(st.ponto.y); changed();
});
const endDragE=()=>{ dragE=null; cvE.style.cursor='default'; };
cvE.addEventListener('pointerup',endDragE); cvE.addEventListener('pointercancel',endDragE);

/* tema e tamanho */
if(window.ResizeObserver){ const ro=new ResizeObserver(requestDraw); ro.observe(cv3); ro.observe(cvE); } else window.addEventListener('resize',requestDraw);
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',requestDraw); }catch(_){}
new MutationObserver(requestDraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(requestDraw);

render();
})();
</script>
